version: '3.8'

services:
  sales-mysql:
    image: mysql:8.0
    container_name: sales-mysql
    environment:
      MYSQL_DATABASE: sales_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - sales_mysql_data:/var/lib/mysql
    networks:
      - sales-network

  jenkins:
    #image: jenkins/jenkins:lts
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: sales-jenkins
    privileged: true
    user: root
    ports:
      - "8083:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Para que Jenkins pueda usar Docker
    networks:
      - sales-network
  # El nuevo integrante: SonarQube
  sales-sonarqube:
    image: sonarqube:lts-community
    container_name: sales-sonarqube
    ports:
      - "9000:9000"
    networks:
      - sales-network

  sales-api:
    #build: No busques una imagen en internet; prepárate para construir una imagen nueva usando el archivo Dockerfile que está en esta misma carpeta
    build: . # Esto le dice a Docker que use el 'Dockerfile' que tienes en la raíz
    #Busca esta imagen ya construida en Docker Hub o Azure Container Registry y descárgala
    #image: miunidaddigital.azurecr.io/sales-api:latest # <--- Agrega esto
    image: diegosantos95/sales-api:latest
    container_name: sales-api
    ports:
      - "8084:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # OJO: Aquí 'localhost' no funciona dentro de Docker, usamos el nombre del servicio 'sales-mysql'
      - SPRING_R2DBC_URL=r2dbc:mysql://sales-mysql:3306/sales_db
      - SPRING_FLYWAY_URL=jdbc:mysql://sales-mysql:3306/sales_db
    depends_on: #espera a que mysql levante para que no se caiga
      sales-mysql:
        condition: service_healthy
    networks: #Esto es como crear un Switch Virtual privado para tus contenedores.
      - sales-network

  prometheus:
    image: prom/prometheus
    container_name: sales-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus # Persistencia de métricas
    ports:
      - "9090:9090"
    networks:
      - sales-network
    depends_on:
      - sales-api

  grafana:
    image: grafana/grafana
    container_name: sales-grafana
    volumes:
      - grafana_data:/var/lib/grafana # Persistencia de dashboards y configuraciones
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - sales-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: sales-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Límite de RAM para que no te trabe la PC
    ports:
      - "9200:9200"
    networks:
      - sales-network
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: sales-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - sales-network
    depends_on:
      - elasticsearch
networks:
  sales-network: # Definición global de la red
    driver: bridge

volumes:
  sales_mysql_data:
  jenkins_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
# si apagas los contenedores con docker-compose down,
# perderás tus datos. Es mejor añadir volúmenes